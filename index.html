<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The LLMs - Loading Screen</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="game-container" class="hidden">
        <div id="city-view"></div>
        <div id="ui-overlay">
            <div class="top-menu">
                <button class="menu-button create-llm-btn">
                    <svg class="llm-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="56" height="56">
                        <path d="M12,2C9.8,2,8,3.8,8,6c0,1.1,0.4,2.1,1.2,2.8C7.3,9.5,6,11.4,6,13.5V16c0,1.1,0.9,2,2,2h1v3c0,0.6,0.4,1,1,1h6c0.6,0,1-0.4,1-1v-3h1c1.1,0,2-0.9,2-2v-2.5c0-2.1-1.3-4-3.2-4.7C17.6,8.1,18,7.1,18,6C18,3.8,16.2,2,14,2H12z M12,4h2c1.1,0,2,0.9,2,2s-0.9,2-2,2h-2C10.9,8,10,7.1,10,6S10.9,4,12,4z M9,13.5c0-1.4,1.1-2.5,2.5-2.5h3c1.4,0,2.5,1.1,2.5,2.5V16H9V13.5z" fill="currentColor"/>
                        <circle cx="10.5" cy="11.5" r="1" fill="currentColor"/>
                        <circle cx="15.5" cy="11.5" r="1" fill="currentColor"/>
                        <rect x="11" y="14" width="4" height="1" fill="currentColor"/>
                    </svg>
                </button>
                <button class="menu-button move-llm-btn">
                    <svg class="llm-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="56" height="56">
                        <!-- Drone body -->
                        <path d="M12,12c-1.7,0-3,1.3-3,3s1.3,3,3,3s3-1.3,3-3S13.7,12,12,12z M12,16c-0.6,0-1-0.4-1-1s0.4-1,1-1s1,0.4,1,1S12.6,16,12,16z" fill="currentColor"/>
                        <circle cx="12" cy="13.5" r="0.5" fill="#333"/>
                        <!-- Drone arms -->
                        <rect x="6.5" y="11.5" width="11" height="1" rx="0.5" fill="currentColor"/>
                        <rect x="11.5" y="7" width="1" height="11" rx="0.5" fill="currentColor"/>
                        <!-- Drone propellers with motor hubs -->
                        <g class="propeller" style="transform-origin: 6.5px 11.5px;">
                            <circle cx="6.5" cy="11.5" r="1" fill="#333"/>
                            <ellipse cx="6.5" cy="11.5" rx="3" ry="0.5" fill="currentColor"/>
                            <ellipse cx="6.5" cy="11.5" rx="0.5" ry="3" fill="currentColor"/>
                        </g>
                        <g class="propeller" style="transform-origin: 17.5px 11.5px;">
                            <circle cx="17.5" cy="11.5" r="1" fill="#333"/>
                            <ellipse cx="17.5" cy="11.5" rx="3" ry="0.5" fill="currentColor"/>
                            <ellipse cx="17.5" cy="11.5" rx="0.5" ry="3" fill="currentColor"/>
                        </g>
                        <g class="propeller" style="transform-origin: 12px 7.5px;">
                            <circle cx="12" cy="7.5" r="1" fill="#333"/>
                            <ellipse cx="12" cy="7.5" rx="3" ry="0.5" fill="currentColor"/>
                            <ellipse cx="12" cy="7.5" rx="0.5" ry="3" fill="currentColor"/>
                        </g>
                        <g class="propeller" style="transform-origin: 12px 17.5px;">
                            <circle cx="12" cy="17.5" r="1" fill="#333"/>
                            <ellipse cx="12" cy="17.5" rx="3" ry="0.5" fill="currentColor"/>
                            <ellipse cx="12" cy="17.5" rx="0.5" ry="3" fill="currentColor"/>
                        </g>
                        <!-- Package with robot parts -->
                        <rect x="9" y="20" width="6" height="3" rx="1" fill="currentColor"/>
                        <path d="M10,20.5h4v0.5H10V20.5z" fill="#333"/>
                        <path d="M10,21.5h4v0.5H10V21.5z" fill="#333"/>
                        <path d="M10.5,20.75h1v1.5h-1V20.75z" fill="#333"/>
                        <path d="M12.5,20.75h1v1.5h-1V20.75z" fill="#333"/>
                    </svg>
                </button>
            </div>
            
            <div id="console-panel" class="hidden">
                <div class="console-header">
                    <div class="console-title">Developer Console</div>
                    <button class="console-close">&times;</button>
                </div>
                <div class="console-buttons">
                    <button class="console-button" id="export-data">Export City Data</button>
                    <button class="console-button" id="import-data">Import City Data</button>
                </div>
                <div class="console-content">
                    <p>Press ~ to toggle this console</p>
                    <p>Use the buttons above to import or export city data</p>
                </div>
            </div>
            
            <div class="console-indicator">
                Press ~ to open console
            </div>
        </div>
    </div>

    <div id="loading-screen">
        <div class="loading-container">
            <div class="llm-toggle-container">
                <span class="llm-toggle-label">AI Tips</span>
                <label class="llm-toggle-switch">
                    <input type="checkbox" id="llm-toggle">
                    <span class="llm-toggle-slider"></span>
                </label>
            </div>
            
            <div class="logo-container">
                <div class="logo">
                    <h1>The LLMs</h1>
                    <div class="logo-subtitle">Life Learning Models</div>
                </div>
            </div>
            
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
                <div class="loading-percentage">0%</div>
            </div>
            
            <div class="loading-tip-container">
                <div class="loading-tip">
                    <span class="tip-label">TIP:</span>
                    <span class="tip-text">LLMs need regular prompting to stay happy.</span>
                </div>
            </div>
            
            <button id="skip-button">Skip Loading</button>
        </div>
    </div>

    <div id="start-overlay">
        <div class="start-container">
            <h1>The LLMs</h1>
            <div class="subtitle">Life Learning Models</div>
            <button id="start-button">Click Here to Start Experience</button>
        </div>
    </div>
    
    <script type="module" src="config.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="cityScene.js"></script>
    <script type="module" src="llmService.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The LLMs - Loading Screen</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="game-container" class="hidden">
        <div id="city-view"></div>
        <div id="ui-overlay">
            <div class="top-menu">
                <button class="menu-button create-llm-btn">Create New LLM</button>
                <div class="resources">
                    <div class="resource">
                        <span class="resource-icon">💰</span>
                        <span class="resource-value">1000</span>
                    </div>
                    <div class="resource">
                        <span class="resource-icon">⚡</span>
                        <span class="resource-value">500</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loading-screen">
        <div class="loading-container">
            <div class="logo-container">
                <div class="logo">
                    <h1>The LLMs</h1>
                    <div class="logo-subtitle">Life Learning Models</div>
                </div>
            </div>
            
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
                <div class="loading-percentage">0%</div>
            </div>
            
            <div class="loading-tip-container">
                <div class="loading-tip">
                    <span class="tip-label">TIP:</span>
                    <span class="tip-text">LLMs need regular prompting to stay happy.</span>
                </div>
            </div>
            
            <button id="skip-button">Skip Loading</button>
        </div>
    </div>
    
    <script type="module" src="config.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="cityScene.js"></script>

</body>
</html>

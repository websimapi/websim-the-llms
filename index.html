<html lang="en">

    <title>The LLMs - Loading Screen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="llm-toggle-container">
        <span class="toggle-label">LLM:</span>
        <label class="toggle-switch">
            <input type="checkbox" id="llm-toggle">
            <span class="toggle-slider"></span>
        </label>
    </div>

    <div class="loading-container">
        <div class="logo-container">
            <div class="logo">
                <h1>The LLMs</h1>
                <div class="logo-subtitle">Life Learning Models</div>
            </div>
        </div>
        
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
            <div class="loading-percentage">0%</div>
        </div>
        
        <div class="loading-tip-container">
            <div class="loading-tip">
                <span class="tip-label">TIP:</span>
                <span class="tip-text">LLMs need regular prompting to stay happy.</span>
            </div>
        </div>
    </div>
